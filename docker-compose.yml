services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insightflow-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    ports:
      - "8000:8000"
    environment:
      - UPLOAD_DIR=/app/storage/uploads
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:5173}
    volumes:
      - ./storage/uploads:/app/storage/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - insightflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: insightflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - insightflow-network

networks:
  insightflow-network:
    driver: bridge
